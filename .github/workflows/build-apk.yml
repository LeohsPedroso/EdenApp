name: Build APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências e buildar o web app
        run: |
          npm install
          npm run build
        env:
          # Configure isso em Settings → Secrets and variables → Actions →
          # Variables (não precisa ser secret, é só a URL pública do backend)
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Adicionar e sincronizar a plataforma Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Definir numero de versao unico (permite atualizar sem desinstalar)
        run: |
          # O projeto Android e gerado do zero a cada build, entao o
          # versionCode sempre voltava pro padrao do Capacitor (nunca
          # mudava) -- o Android EXIGE que esse numero sempre aumente pra
          # deixar instalar uma versao nova por cima da antiga; sem isso,
          # a instalacao falha silenciosamente e so funciona desinstalando
          # a versao anterior primeiro. Usa o numero sequencial do proprio
          # workflow do GitHub Actions (github.run_number), que so aumenta.
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i -E 's/versionName "[^"]*"/versionName "1.0.${{ github.run_number }}"/' android/app/build.gradle
          echo "--- versao definida ---"
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Permissão de microfone (getUserMedia precisa disso pra gravar áudio)
        run: |
          # O projeto Android e gerado do zero a cada build (nao fica
          # versionado no git), entao qualquer permissao nativa precisa ser
          # "remendada" aqui, logo apos ser gerado.
          #
          # Duas coisas sao necessarias pro botao de gravar audio funcionar:
          # 1) a permissao RECORD_AUDIO no manifest (senao o Android nem
          #    deixa pedir acesso ao microfone)
          # 2) o WebView conceder a permissao quando o getUserMedia() do
          #    navegador pedir -- isso e uma camada SEPARADA da permissao
          #    do Android, e o Capacitor nao faz isso sozinho por padrao.
          #    Sem isso, getUserMedia() falha na hora com erro de permissao,
          #    mesmo com a permissao do Android concedida -- e exatamente o
          #    bug que fazia o botao de audio ficar preso no estado de erro.
          sed -i '/<application/i\    <uses-permission android:name="android.permission.RECORD_AUDIO" />' android/app/src/main/AndroidManifest.xml

          cat > android/app/src/main/java/com/edenmc/app/MainActivity.java << 'JAVA_EOF'
          package com.edenmc.app;

          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  this.bridge.getWebView().setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> request.grant(request.getResources()));
                      }
                  });
              }
          }
          JAVA_EOF

      - name: Compilar o APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publicar o APK como artefato do workflow
        uses: actions/upload-artifact@v4
        with:
          name: edenmc-v1.0.${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
