name: Build APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências e buildar o web app
        run: |
          npm install
          npm run build
        env:
          # Configure isso em Settings → Secrets and variables → Actions →
          # Variables (não precisa ser secret, é só a URL pública do backend)
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Adicionar e sincronizar a plataforma Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Compilar o APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publicar o APK como artefato do workflow
        uses: actions/upload-artifact@v4
        with:
          name: edenmc-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
